# Üretim örneği: nginx (TLS, hız sınırı) → backend → postgres, + LiveKit.
# Yalnızca nginx dışarıya açılır; backend ve veritabanı iç ağdadır.
# Kullanım:  cp .env.example .env  →  değerleri doldur  →  docker compose up -d --build
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: trlive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: trlive
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trlive"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://trlive:${POSTGRES_PASSWORD}@postgres:5432/trlive
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli (en az 32 karakter)}
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL gerekli}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      TRUST_PROXY: "1"                # nginx arkasında gerçek istemci IP'si için ŞART
      CORS_ORIGIN: "*"
      FIREWALL_ALLOW_IPS: ${FIREWALL_ALLOW_IPS:-}
      BANNED_WORDS: ${BANNED_WORDS:-}
    volumes:
      - uploads:/app/uploads
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks: [internal]

  # LiveKit UDP/TCP medya portları için host ağı en sorunsuz yöntemdir.
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

volumes:
  pgdata:
  uploads:

networks:
  internal:
