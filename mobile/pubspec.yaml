name: tr_live
description: TR Live - canlı sesli/görüntülü odalar, aile, WIP, ajans/yayıncı, hediyeler ve yönetim
publish_to: none
version: 2.48.1+1
environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  shared_preferences: ^2.5.3
  livekit_client: ^2.5.1
  web_socket_channel: ^3.0.3
  lottie: ^3.3.1
  flutter_vap_kit: ^0.1.2
  flutter_foreground_task: ^11.0.1
  flutter_overlay_window: ^0.5.0
  just_audio: ^0.10.4
  file_picker: ^8.1.2
  image_picker: ^1.2.0
  # Kırpılan fotoğrafı JPEG'e çevirmek için (saf Dart; yerel kod eklemez).
  image: ^4.2.0
  # livekit_client zaten bu paketi kullanıyor; 'any' aynı sürümü seçer (yeni yerel kod eklenmez).
  device_info_plus: any
  cupertino_icons: ^1.0.8
  # Yönetimden herkese telefon bildirimi (Firebase gerektirmez). Sürüm sabit: API'si bu sürüme göre yazıldı.
  flutter_local_notifications: 19.5.0
  # Google / Facebook girişi için giriş sayfasını tarayıcıda açar.
  url_launcher: ^6.3.1
# shared_preferences_android 2.5.0 (16 Ekim 2026) yeni JNI yöntemine geçti; yayın APK'sında küçültme (R8) yüzünden
# "NoSuchMethodError ... SharedPreferencesApiRegistrar.getAll" ile açılışta çöküyor. Sorunsuz son yayınlanmış sürüme (2.4.28) sabitlendi.
dependency_overrides:
  shared_preferences_android: 2.4.28
  # Bilinen sorunsuz son sürüm (yeni sürümler JNI'ye geçerse aynı açılış çökmesi olmasın).
  url_launcher_android: 6.3.33
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
