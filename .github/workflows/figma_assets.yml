name: Figma görsellerini indir

# Figma tasarım dosyasındaki tüm görselleri (çerçeve, kanat, arka plan, rozet...) orijinal kalitede indirir ve
# "figma-assets" dalına koyar (ana dal ve zip güncellemesi etkilenmez). Hangi görselin hangi ekranda kullanıldığı
# index.json'da yazar. İsteğe bağlı: deploy/figma/nodes.txt varsa ("<düğüm id> <ad> [ölçek]") o düğümler ayrıca
# hazır görüntü olarak (render) alınır.
# Gerekli gizli anahtar: FIGMA_TOKEN (Figma > Settings > Security > Personal access tokens, "File content: Read").
on:
  workflow_dispatch:
    inputs:
      screens:
        description: "Görüntüsü alınacak ekranlar (virgülle düğüm id)"
        required: false
        default: "445:14920,2434:1955,2434:2896,2420:2258,2420:2994,2438:3708,2442:4354,2442:4196,2434:2129,2434:2547,2442:4995,2442:4564,2434:2273,2434:2679,2438:3280,2438:3519,2442:5183,2438:3839,2438:3945,2438:3610,2420:2910,2420:3045,2562:2009,2562:4480,2582:6870,2562:2693,2562:2171,2562:3026,2562:3150,2562:3198,2562:3246,2562:3293,2582:6606,2582:6712,2582:10937,2139:2115,2139:2482,2582:7601,2562:5900,2562:6020,2562:3361,2562:3424,2576:6090,2576:6262,2576:6281,2582:11009,2582:11021,2687:3194,2687:3406,2687:4298,2965:2219,2965:2390,2965:2447,2965:2617,2965:2674,2965:2844,2965:2901,2965:3071,2965:3128,2965:3380,2965:3437,2965:3618,2576:6305,2582:11034,2839:2196,2841:2447,2841:2582,2842:2718,2843:2848,2899:2203,2919:2204,2919:2333,2919:2594,2921:2727,2924:2845,2928:2219,2931:2359,2933:2506"

permissions:
  contents: write

jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Görselleri Figma'dan al
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE: N8aBk1e0Shr9FbPFP6Z23M
          SCREENS: ${{ inputs.screens }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIGMA_TOKEN:-}" ]; then echo "HATA: FIGMA_TOKEN gizli anahtarı eklenmemiş."; exit 1; fi
          pip install --quiet pillow
          mkdir -p /tmp/out/img /tmp/out/render
          python3 -u - <<'PY'
          import io, json, os, time, urllib.request, urllib.parse
          from concurrent.futures import ThreadPoolExecutor
          from PIL import Image
          tok = os.environ['FIGMA_TOKEN']; key = os.environ['FIGMA_FILE']
          import urllib.error
          def get(url, auth=True):
              for i in range(8):
                  try:
                      req = urllib.request.Request(url, headers={'X-Figma-Token': tok} if auth else {})
                      with urllib.request.urlopen(req, timeout=600) as r: return r.read()
                  except urllib.error.HTTPError as e:
                      wait = int(e.headers.get('Retry-After') or 0) or 15 * (i + 1)
                      print(f'HTTP {e.code} ({url[:60]}), {wait} sn bekleniyor', flush=True)
                      if e.code in (400, 403, 404): raise SystemExit(f'Figma hata {e.code}: ' + e.read()[:300].decode('utf-8', 'ignore'))
                      if wait > 900: raise SystemExit('Figma istek sınırı: çok uzun bekleme (' + str(wait) + ' sn)')
                      time.sleep(wait)
                  except Exception as e:
                      print('tekrar deneniyor:', str(e)[:120], flush=True); time.sleep(10 * (i + 1))
              raise SystemExit('Figma yanıt vermedi: ' + url[:120])

          # 1) Dosya ağacı: hangi görsel hangi katmanda / hangi ekranda
          print('dosya ağacı indiriliyor...', flush=True)
          doc = json.loads(get(f'https://api.figma.com/v1/files/{key}'))
          index = {}
          def walk(n, top):
              bb = n.get('absoluteBoundingBox') or {}
              for f in (n.get('fills') or []):
                  if f.get('type') == 'IMAGE' and f.get('imageRef'):
                      index.setdefault(f['imageRef'], []).append({
                          'id': n['id'], 'name': n.get('name'), 'top': top, 'w': round(bb.get('width') or 0), 'h': round(bb.get('height') or 0),
                          'mode': f.get('scaleMode'), 'visible': n.get('visible', True)})
              for c in n.get('children') or []:
                  walk(c, top)
          for page in doc['document']['children']:
              for fr in page.get('children') or []:
                  walk(fr, f"{fr['id']} {fr.get('name')}")
          print('görsel sayısı:', len(index), flush=True)

          # 2) Orijinal görseller (webp, en fazla 1600 px)
          urls = json.loads(get(f'https://api.figma.com/v1/files/{key}/images'))['meta']['images']
          def save(ref):
              u = urls.get(ref)
              if not u: return ref, 'url yok'
              try:
                  im = Image.open(io.BytesIO(get(u, auth=False)))
                  im = im.convert('RGBA') if im.mode in ('P', 'LA', 'RGBA', 'PA') or 'transparency' in im.info else im.convert('RGB')
                  if max(im.size) > 1600: im.thumbnail((1600, 1600), Image.LANCZOS)
                  im.save(f'/tmp/out/img/{ref}.webp', 'WEBP', quality=88, method=5)
                  return ref, None
              except BaseException as e:
                  return ref, str(e)[:80]
          with ThreadPoolExecutor(8) as ex:
              for ref, err in ex.map(save, list(index)):
                  if err: print('atlandı', ref, err)
          json.dump(index, open('/tmp/out/index.json', 'w'), ensure_ascii=False, indent=0)

          # 2b) Ekran görüntüleri: telefon boyutundaki her ekran (jpg, 2x) ve ekran listesi
          os.makedirs('/tmp/out/screens', exist_ok=True)
          want = [x.strip() for x in (os.environ.get('SCREENS') or '').split(',') if x.strip()]
          screens = []
          for page in doc['document']['children']:
              for fr in page.get('children') or []:
                  bb = fr.get('absoluteBoundingBox') or {}
                  if 300 <= (bb.get('width') or 0) <= 450 and (bb.get('height') or 0) >= 500:
                      screens.append({'id': fr['id'], 'name': fr.get('name'), 'x': bb.get('x'), 'y': bb.get('y'), 'w': bb.get('width'), 'h': bb.get('height'), 'shot': fr['id'] in want})
          json.dump(screens, open('/tmp/out/screens.json', 'w'), ensure_ascii=False, indent=0)
          print('ekran sayısı:', len(screens))
          def shot(chunk):
              q = urllib.parse.urlencode({'ids': ','.join(s['id'] for s in chunk), 'format': 'jpg', 'scale': '2'})
              try:
                  imgs = json.loads(get(f'https://api.figma.com/v1/images/{key}?{q}')).get('images') or {}
              except SystemExit:
                  return
              for s in chunk:
                  u = imgs.get(s['id'])
                  if not u: continue
                  try:
                      im = Image.open(io.BytesIO(get(u, auth=False))).convert('RGB')
                      im.save('/tmp/out/screens/' + s['id'].replace(':', '-') + '.jpg', 'JPEG', quality=80)
                  except BaseException as e:
                      print('ekran atlandı', s['id'], str(e)[:60])
          with ThreadPoolExecutor(1) as ex:
              todo = [{'id': i} for i in want]
              list(ex.map(shot, [todo[i:i + 25] for i in range(0, len(todo), 25)]))

          # 3) İsteğe bağlı hazır görüntüler
          if os.path.exists('deploy/figma/nodes.txt'):
              rows = []
              for line in open('deploy/figma/nodes.txt', encoding='utf-8'):
                  line = line.split('#', 1)[0].strip()
                  if line: p = line.split(); rows.append((p[0], p[1], p[2] if len(p) > 2 else '3'))
              by = {}
              for nid, name, sc in rows: by.setdefault(sc, []).append((nid, name))
              for sc, items in by.items():
                  for i in range(0, len(items), 40):
                      chunk = items[i:i + 40]
                      q = urllib.parse.urlencode({'ids': ','.join(n for n, _ in chunk), 'format': 'png', 'scale': sc})
                      imgs = json.loads(get(f'https://api.figma.com/v1/images/{key}?{q}')).get('images') or {}
                      for nid, name in chunk:
                          if imgs.get(nid): open(f'/tmp/out/render/{name}.png', 'wb').write(get(imgs[nid], auth=False))
          PY
          du -sh /tmp/out; ls /tmp/out/img | wc -l

      - name: figma-assets dalına kaydet
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/out
          git init -q -b figma-assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Figma görselleri"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" figma-assets
