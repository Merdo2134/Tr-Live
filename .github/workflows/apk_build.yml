name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Sunucu adresi"
        required: false
        default: "https://tr-live-1.onrender.com"
      allow_http:
        description: "http:// adresine izin ver (yalnızca test için)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/apk_build.yml"

permissions:
  contents: write  # APK çıktısını yükleyebilmek veya release oluşturabilmek için write yapıldı

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INPUT_API_URL: ${{ github.event.inputs.api_url }}
      INPUT_ALLOW_HTTP: ${{ github.event.inputs.allow_http }}
      REPO_API_URL: ${{ vars.API_URL }}
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Flutter projesini bul (pubspec.yaml nerede olursa olsun)
        shell: bash
        run: |
          set -euo pipefail
          APP_PUBSPEC=""
          while IFS= read -r f; do
            if grep -q 'sdk: flutter' "$f"; then APP_PUBSPEC="$f"; break; fi
          done < <(find . -name pubspec.yaml \
            -not -path '*/.dart_tool/*' -not -path '*/build/*' -not -path '*/.symlinks/*' \
            -not -path '*/node_modules/*' -not -path './.git/*' | sort)
          if [ -z "$APP_PUBSPEC" ]; then
            echo "::error::Depoda Flutter projesi (içinde 'sdk: flutter' geçen pubspec.yaml) bulunamadı."
            echo "Deponun ilk 3 seviyesi:"; find . -maxdepth 3 -not -path './.git/*' | sort | head -80
            exit 1
          fi
          APP_DIR="$(cd "$(dirname "$APP_PUBSPEC")" && pwd)"
          APP_NAME="$(grep -m1 -E '^name:' "$APP_PUBSPEC" | sed -E 's/^name:[[:space:]]*//; s/["'"'"']//g' | tr -d '\r ')"
          if ! printf '%s' "$APP_NAME" | grep -qE '^[a-z][a-z0-9_]*$'; then APP_NAME="tr_live"; fi
          echo "APP_DIR=$APP_DIR"   >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "Flutter projesi bulundu: $APP_DIR (paket adı: $APP_NAME)"

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: android klasörü yoksa sıfırdan üret
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          flutter --version
          HAS_GRADLE=false
          if [ -f android/app/build.gradle ] || [ -f android/app/build.gradle.kts ]; then HAS_GRADLE=true; fi
          if [ -f android/app/src/main/AndroidManifest.xml ] && [ "$HAS_GRADLE" = true ]; then
            echo "android klasörü zaten var, üretilmiyor."
          else
            echo "android klasörü eksik veya yarım; flutter create ile üretiliyor..."
            rm -rf android
            flutter create . --platforms=android --project-name "$APP_NAME" --org com.trlive
            if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm -f test/widget_test.dart; fi
          fi
          test -f android/app/src/main/AndroidManifest.xml
          echo "android/app içeriği:"; ls -la android/app

      - name: Android ayarlarını düzelt (minSdk 24, izinler)
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib, sys

          gradle = None
          for name in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              if os.path.exists(name):
                  gradle = pathlib.Path(name); break
          if gradle is None:
              sys.exit("HATA: android/app/build.gradle(.kts) bulunamadı")
          src = gradle.read_text()
          new, n = re.subn(r"(minSdk(?:Version)?)(\s*=?\s*)flutter\.minSdkVersion", r"\g<1>\g<2>24", src)
          if n == 0:
              m = re.search(r"minSdk(?:Version)?\s*=?\s*(\d+)", src)
              if m and int(m.group(1)) >= 24:
                  print(f"minSdk zaten {m.group(1)}")
              elif m:
                  new = re.sub(r"(minSdk(?:Version)?)(\s*=?\s*)\d+", r"\g<1>\g<2>24", src, count=1)
                  n = 1
              else:
                  print("UYARI: minSdk satırı bulunamadı; Flutter varsayılanı kullanılacak")
          if n:
              gradle.write_text(new)
              print(f"{gradle}: minSdk 24 yapıldı")
          PY

      - name: Bağımlılıkları indir
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Run flutter analyze
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-fatal-infos
        continue-on-error: true # 👈 Hataları görmeye devam edersiniz ama süreciniz kilitlenmez.

      - name: APK Derle
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release

      - name: APK Dosyasını Kaydet (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
