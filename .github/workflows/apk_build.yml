name: Android APK'sı oluşturun

on:
  push:
    branches: [ "main", "master", "ana" ]
  workflow_dispatch:

env:
  APP_DIR: "mobile"

jobs:
  build-apk:
    name: Android APK'sı oluşturun
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Flutter projesini bul (pubspec.yaml nerede olursa olsun)
        id: find-flutter
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "APP_DIR=." >> $GITHUB_ENV
          elif [ -f "mobile/pubspec.yaml" ]; then
            echo "APP_DIR=mobile" >> $GITHUB_ENV
          else
            FF=$(find . -name "pubspec.yaml" | head -n 1)
            if [ -n "$FF" ]; then
              echo "APP_DIR=$(dirname "$FF")" >> $GITHUB_ENV
            fi
          fi

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: android klasörü yoksa sıfırdan üret
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          flutter --version
          HAS_GRADLE=false
          if [ -f android/app/build.gradle ] || [ -f android/app/build.gradle.kts ]; then HAS_GRADLE=true; fi
          if [ -f android/app/src/main/AndroidManifest.xml ] && [ "$HAS_GRADLE" = true ]; then
            echo "Android bileşenleri zaten var, üretilmiyor."
          else
            echo "Android bileşenleri eksik veya yarım; flutter create ile üretiliyor..."
            rm -rf android
            flutter create --platforms=android --project-name "TLive" --org com.trlive .
            if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm -f test/widget_test.dart; fi
          fi
          test -f android/app/src/main/AndroidManifest.xml

      - name: Android'i düzeltin (minSdk 24, izinler)
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path

          # 1) minSdk ayarları
          gradle = None
          for name in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              if os.path.exists(name):
                  gradle = Path(name); break
          if gradle is None:
              sys.exit("HATA: android/app/build.gradle(.kts) bulunamadı")
          src = gradle.read_text()
          new, n = re.subn(r"(minSdk(?:Version)?)(?:\s*=?\s*)F\w+\.\w+", r"\g<1> 24", src)
          if n == 0:
              m = re.search(r"minSdk(?:Version)?\s*=?\s*(\d+)", src)
              if m and int(m.group(1)) >= 24:
                  print(f"minSdk zaten {m.group(1)}")
              else:
                  new, n = re.subn(r"(minSdk(?:Version)?)(?:\s*=?\s*)\d+", r"\g<1> 24", src, count=1)
                  if n == 0:
                      print("UYARI: minSdk dosyası hatalı; Flutter varsayılanı kullanılacak")
          if n > 0:
              gradle.write_text(new)
              print("gradle: minSdk 24 yapıldı")

          # 2) Manifest izinleri ve eklentileri
          mf = Path("android/app/src/main/AndroidManifest.xml")
          s = mf.read_text()
          perms = ["INTERNET", "RECORD_AUDIO", "CAMERA", "MODIFY_AUDIO_SETTINGS", "ACCESS_NETWORK_STATE", "BLUETOOTH",
                   "WAKE_LOCK", "POST_NOTIFICATIONS", "FOREGROUND_SERVICE", "FOREGROUND_SERVICE_MICROPHONE",
                   "SYSTEM_ALERT_WINDOW", "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"]
          add = "".join(f'    <uses-permission android:name="android.permission.{p}"/>\n' for p in perms if f'android.permission.{p}' not in s)
          if add:
              s = s.replace("<application", add + "    <application", 1)
          s = s.replace("<manifest ", '<manifest xmlns:tools="http://android.com" ', 1)
          
          # Hizmetlerin eklenmesi
          services = ""
          if "com.pravera.flutter_foreground_task.service.ForegroundService" not in s:
              services += '        <service android:name="com.pravera.flutter_foreground_task.service.ForegroundService" android:foregroundServiceType="mediaPlayback|microphone" android:exported="false" />\n'
          if "flutter.overlay.window.flutter_overlay_window.OverlayService" not in s:
              services += '        <service android:name="flutter.overlay.window.flutter_overlay_window.OverlayService" android:exported="false" android:property:android.annotation.PROPERTY_SPECIAL_USE_FGS_SUBTYPE="Oda" />\n'
          if services:
              s = s.replace("</application>", services + "    </application>", 1)
          
          if os.environ.get("INPUT_ALLOW_HTTP", "").lower() == "true" and "usesCleartextTraffic" not in s:
              s = s.replace("<application ", '<application android:usesCleartextTraffic="true" ', 1)
              print("http (cleartext) izni eklendi")
          
          mf.write_text(s)
          print("Manifest izinleri tamam")
          PY
          
          # Kotlin 2.2.20 Yaması
          if [ -f mobile/android/settings.gradle ]; then
            sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "2.2.20"/g' mobile/android/settings.gradle
          elif [ -f android/settings.gradle ]; then
            sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "2.2.20"/g' android/settings.gradle
          fi

      - name: Sunucu adresi doğrula
        shell: bash
        run: |
          set -euo pipefail
          echo "Sunucu adresi doğrulama adımı pas geçildi veya manuel tetiklendi."

      - name: Bağımlılıkları indir
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Kod analizi (bilgi amaçlı, derlemeyi durdurmaz)
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-fatal-infos || true

      - name: APK derle
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release

      - name: APK'yı çıktı olarak paylaş
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
