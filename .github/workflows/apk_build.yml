name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Sunucu adresi"
        required: false
        default: "https://onrender.com"
      allow_http:
        description: "http:// adresine izin ver (yalnızca test için)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/apk_build.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INPUT_API_URL: ${{ github.event.inputs.api_url }}
      INPUT_ALLOW_HTTP: ${{ github.event.inputs.allow_http }}
      REPO_API_URL: ${{ vars.API_URL }}
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Flutter projesini bul (pubspec.yaml nerede olursa olsun)
        shell: bash
        run: |
          set -euo pipefail
          APP_PUBSPEC=""
          while IFS= read -r f; do
            if grep -q 'sdk: flutter' "$f"; then APP_PUBSPEC="$f"; break; fi
          done < <(find . -name pubspec.yaml \
            -not -path '*/.dart_tool/*' -not -path '*/build/*' -not -path '*/.symlinks/*' \
            -not -path '*/node_modules/*' -not -path './.git/*' | sort)
          if [ -z "$APP_PUBSPEC" ]; then
            echo "::error::Depoda Flutter projesi (içinde 'sdk: flutter' geçen pubspec.yaml) bulunamadı."
            exit 1
          fi
          APP_DIR="$(cd "$(dirname "$APP_PUBSPEC")" && pwd)"
          APP_NAME="$(grep -m1 -E '^name:' "$APP_PUBSPEC" | sed -E 's/^name:[[:space:]]*//; s/["'"'"']//g' | tr -d '\r ')"
          if ! printf '%s' "$APP_NAME" | grep -qE '^[a-z][a-z0-9_]*$'; then APP_NAME="tr_live"; fi
          echo "APP_DIR=$APP_DIR"   >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: android klasörü yoksa sıfırdan üret
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          if [ -f android/app/build.gradle ] || [ -f android/app/build.gradle.kts ]; then
            echo "android klasörü zaten var."
          else
            flutter create . --platforms=android --project-name "$APP_NAME" --org com.trlive
            if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm -f test/widget_test.dart; fi
          fi

      - name: Android SDK uyumsuzluklarını çöz (Zorunlu compileSdk 36)
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                          buildToolsVersion "36.0.0"
                          
                          defaultConfig {
                              minSdkVersion 24
                              targetSdkVersion 36
                          }
                      }
                  }
              }
          }
          EOF
          echo "Android derleme dosyalarına zorunlu SDK 36 enjeksiyonu tamamlandı."

      - name: Bağımlılıkları indir
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Run flutter analyze
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: APK Derle
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --verbose || echo "Derleme tamamlandı, çıktı aranıyor..."

      - name: Üretilen APK'yı Dinamik Olarak Bul ve Konumlandır
        shell: bash
        run: |
          echo "Üretilen APK dosyaları aranıyor..."
          FOUND_APK=$(find . -name "app-release.apk" -not -path '*/.dart_tool/*' -print -quit || true)
          if [ -n "$FOUND_APK" ]; then
            echo "APK başarıyla bulundu: $FOUND_APK"
            mkdir -p /tmp/apk_out
            cp "$FOUND_APK" /tmp/apk_out/app-release.apk
            echo "APK_READY=true" >> "$GITHUB_ENV"
          else
            echo "::error::Üretilen APK dosyası hiçbir klasör altında bulunamadı!"
            exit 1
          fi

      - name: APK Dosyasını Kaydet (Artifact)
        if: env.APK_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: /tmp/apk_out/app-release.apk
