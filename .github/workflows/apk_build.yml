name: Android APK'sı oluşturun

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Sunucu adresi (örn. https://siteniz.com)"
        required: false
        default: "https://example.com"
      allow_http:
        description: "http:// adresine izin ver (yalnızca test için)"
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - "mobile/**"
      - ".github/workflows/apk_build.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INPUT_API_URL: \${{ github.event.inputs.api_url }}
      INPUT_ALLOW_HTTP: \${{ github.event.inputs.allow_http }}
      REPO_API_URL: \${{ vars.API_URL }}
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Flutter projesini bul (pubspec.yaml nerede olursa olsun)
        shell: bash
        run: |
          set -e pipefail
          APP_PUBSPEC=""
          while IFS= read -r f; do
            if grep -q 'sdk: flutter' "\$f"; then APP_PUBSPEC="\$f"; break; fi
          done < <(find . -name pubspec.yaml \
            -not -path "*/.dart_tool/*" -not -path "*/build/*" -not -path "*/.symlinks/*" \
            -not -path "*/node_modules/*" -not -path "*/.git/*" | sort)
          
          if [ -z "\$APP_PUBSPEC" ]; then
            echo "::error::Depoda Flutter projesi (içinde 'sdk: flutter' geçen pubspec.yaml) bulunamadı."
            exit 1
          fi
          
          # Dizin çakışmalarını önleyen güvenli bağıl yol (relative path) üretimi
          APP_DIR="(dirname "APP_PUBSPEC" | sed "s|^\(GITHUB_WORKSPACE/\vert{}\vert{}; s\vert{}^\)GITHUB_WORKSPACE||")"
          [ "\$APP_DIR" == "." ] && APP_DIR=""
          
          APP_NAME=\$(grep -E '^[[:space:]]*name:' "\(APP_PUBSPEC" \vert{} sed -E "s/name:[[:space:]]*['\"]?//; s/['\"]?[[:space:]]*\)//g" | tr -d \('\r')\)
          if ! [[ "\(APP_NAME" =~ ^[a-z0-9_]+\) ]]; then 
            APP_NAME="tr_live"
          fi
          
          echo "APP_DIR=\(APP_DIR" >> "\)GITHUB_ENV"
          echo "APP_NAME=\(APP_NAME" >> "\)GITHUB_ENV"
          echo "Flutter projesi bulundu: Dizin='\$APP_DIR' Paket Adı='\$APP_NAME'"

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: android klasörü yoksa sıfırdan üret
        shell: bash
        working-directory: \${{ env.APP_DIR }}
        run: |
          set -e pipefail
          flutter --version
          HAS_GRADLE=false
          if [ -f android/build.gradle ] || [ -f android/build.gradle.kts ]; then HAS_GRADLE=true; fi
          if [ -f android/app/src/main/AndroidManifest.xml ] && [ "\$HAS_GRADLE" = true ]; then
            echo "android klasörü zaten var, üretilmiyor."
          else
            echo "android klasörü eksik veya yarım; flutter create ile üretiliyor..."
            rm -rf android
            flutter create . --platforms=android --project-name "\$APP_NAME" --org com.trlive
          fi

      - name: Android ayarlarını düzelt (minSdk 24, izinler)
        shell: bash
        working-directory: \${{ env.APP_DIR }}
        run: |
          set -e pipefail
          python3 - << 'EOF'
          import os
          import re
          from pathlib import Path

          # 1) minSdk, compileSdk ve targetSdk Güncelleme
          gradle_file = None
          for name in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if Path(name).exists():
                  gradle_file = Path(name)
                  break

          if gradle_file is None:
              print("HATA: build.gradle(.kts) dosyası bulunamadı!")
              exit(1)

          src = gradle_file.read_text(encoding="utf-8")
          
          if "minSdkVersion" in src:
              m = re.search(r"minSdkVersion\s*=?\s*(\d+)", src)
              if m and int(m.group(1)) < 24:
                  src = re.sub(r"(minSdkVersion\s*=?\s*)\d+", r"\g<1>24", src, count=1)
                  print("minSdkVersion 24 olarak güncellendi.")

          for sdk_key in ["compileSdkVersion", "targetSdkVersion", "compileSdk", "targetSdk"]:
              pattern = rf"({sdk_key}\s*=?\s*)(\d+|[A-Za-z\-_\.]+)"
              src = re.sub(pattern, rf"\g<1>35", src)

          gradle_file.write_text(src, encoding="utf-8")
          print(f"[BAŞARILI] {gradle_file.name} Android SDK bileşenleri güncellendi (minSdk: 24, compile/targetSdk: 35).")

          # 2) Manifest İzinleri ve Ayarları
          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          if manifest_path.exists():
              s = manifest_path.read_text(encoding="utf-8")
              
              perms = [
                  "INTERNET", "RECORD_AUDIO", "CAMERA", "MODIFY_AUDIO_SETTINGS", 
                  "ACCESS_NETWORK_STATE", "BLUETOOTH", "CONNECT", "WAKE_LOCK", 
                  "POST_NOTIFICATIONS", "FOREGROUND_SERVICE", "FOREGROUND_SERVICE_MICROPHONE", 
                  "FOREGROUND_SERVICE_CONNECTED_DEVICE", "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"
              ]
              
              add_perms = ""
              for p in perms:
                  perm_string = f'<uses-permission android:name="android.permission.{p}" />'
                  if perm_string not in s:
                      add_perms += f"    {perm_string}\n"
              
              if add_perms:
                  s = s.replace("<application", f"{add_perms}<application", 1)

              services = ""
              if "flutter_background_task.service.ForegroundService" not in s:
                  services += '        <service android:name="com.pravera.flutter_background_task.service.ForegroundService" android:foregroundServiceType="microphone" />\n'
              if "OverlayService" not in s:
                  services += '        <service android:name="flutter.overlay.window.flutter_overlay_window.OverlayService" android:exported="false" android:foregroundServiceType="specialUse">\n            <property android:name="android.app.PROPERTY_SPECIAL_USE_FOS_SUBTYPE" android:value="Ui"/ >\n        </service>\n'
              
              if services:
                  s = s.replace("</application>", f"{services}    </application>", 1)

              if os.environ.get("INPUT_ALLOW_HTTP", "").lower() == "true" and "usesCleartextTraffic" not in s:
                  s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
                  print("HTTP (cleartext) izni eklendi.")

              manifest_path.write_text(s, encoding="utf-8")
              print("AndroidManifest.xml izinleri başarıyla tanımlandı.")
          EOF

      - name: Sunucu adresini doğrula
        shell: bash
        run: |
          set -e pipefail
          API_URL="\${INPUT_API_URL:-}"
          [ -n "\(API_URL" ] \vert{}\vert{} API_URL="\){REPO_API_URL:-}"
          [ -n "\$API_URL" ] || API_URL="https://example.com"
          
          if ! [[ "\$API_URL" =~ ^https?://[A-Za-z0-9.-]+ ]]; then
             echo "::error::Sunucu adresi geçersiz: \$API_URL"
             exit 1
          fi
          
          if [[ "\(API_URL" == http://* ]] && [ "\){INPUT_ALLOW_HTTP}" != "true" ]; then
             echo "::error::Android http:// adreslerini varsayılan olarak engeller. 'allow_http' kullanın."
             exit 1
          fi
          echo "API_URL=\(API_URL" >> "\)GITHUB_ENV"
          echo "Sunucu adresi doğrulandı: \$API_URL"

      - name: Bağımlılıkları indir
        shell: bash
        working-directory: \${{ env.APP_DIR }}
        run: flutter pub get

      - name: Kod analizi (bilgi amaçlı, derlemeyi durdurmaz)
        shell: bash
        working-directory: \${{ env.APP_DIR }}
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || true
          echo "Hata sayısı: \$(grep -c 'error' analyze.log || true)"

      - name: APK derle
        shell: bash
        working-directory: \${{ env.APP_DIR }}
        run: |
          set -e pipefail
          flutter build apk --release --no-shrink --target-platform android-arm64 --dart-define=API_URL="\${{{ env.API_URL }}" | tee build.log
          ls -la build/app/outputs/flutter-apk/

      - name: Özet
        if: success()
        shell: bash
        working-directory: \${{ env.APP_DIR }}
        run: |
          APK=\$(ls build/app/outputs/flutter-apk/*.apk | head -n 1)
          {
            echo "### APK Hazır ✅"
            echo " * Dosya: \`$(basename "$APK")\` ((du -h "APK" | cut -f1))"
            echo " * Sunucu Adresi: \`${{ env.API_URL }}\`"
            echo " * Aşağıdaki **Artifacts** bölümünden \`tr-live-apk\` dosyasını indirin, zip'ten çıkarıp yükleyin."
          } >> "\$GITHUB_STEP_SUMMARY"

      - name: APK'yı çıktı olarak paylaş
        uses: actions/upload-artifact@v4
        with:
          name: tr-live-apk
          path: \${{ env.APP_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Hata günlüklerini paylaş
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            \${{ env.APP_DIR }}/build.log
            \${{ env.APP_DIR }}/analyze.log
          if-no-files-found: ignore
          retention-days: 7
