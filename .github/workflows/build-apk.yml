name: Flutter APK Derleme

on:
  push:
    branches: [ "main", "ana" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Gradle ve Dosya Yollarını Zorla Bağla
        run: |
          # Disk üzerinde gerçek pubspec.yaml dosyasının yerini bul
          REAL_PATH=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Gerçek Flutter yolu bulundu: $REAL_PATH"
          
          # Hatalı çift klasör /home/runner/work/Tr-Live/Tr-Live/ hatasını çözmek için sembolik bağ oluştur
          sudo mkdir -p /home/runner/work/Tr-Live/Tr-Live/
          sudo ln -s "$GITHUB_WORKSPACE/$REAL_PATH" /home/runner/work/Tr-Live/Tr-Live/mobile
          
          # Çalışma dizinine geç ve derlemeyi başlat
          cd "$GITHUB_WORKSPACE/$REAL_PATH"
          flutter pub get
          flutter build apk --release
          
      - name: APK'yı Çıktı Olarak Paylaş
        uses: actions/upload-artifact@v4
        with:
          name: tr-canli-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
