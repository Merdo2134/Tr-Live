name: Flutter APK Derleme

on:
  push:
    branches: [ main, ana ] 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile # Tüm komutları doğrudan mobile klasörünün içinde çalıştırır
    steps:
      - uses: actions/checkout@v4
      
      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Bağımlılıkları Yükle
        run: flutter pub get
          
      - name: APK Derle
        run: flutter build apk --release
          
      - name: APK'yı Çıktı Olarak Paylaş
        uses: actions/upload-artifact@v4
        with:
          name: tr-canli-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
