name: Flutter APK Derleme

on:
  push:
    branches: [ "main", "ana" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Hatalı Yolları Tamir Et ve Derle
        run: |
          # Projenin gerçek yerini bul
          REAL_PATH=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          cd "$REAL_PATH"
          
          # Proje içindeki tüm dosyalarda kalmış olabilecek hatalı sabit yolları temizle
          find . -type f -writable -exec sed -i "s|/home/runner/work/Tr-Live/Tr-Live/|$GITHUB_WORKSPACE/|g" {} + 2>/dev/null || true
          
          # Temiz kurulum ve derleme
          flutter pub get
          flutter build apk --release
          
      - name: APK'yı Çıktı Olarak Paylaş
        uses: actions/upload-artifact@v4
        with:
          name: tr-canli-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
