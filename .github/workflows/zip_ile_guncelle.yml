name: Zip ile güncelle

# Kullanım (token gerekmez): depoya GitHub sitesinden "Add file > Upload files" ile TR-Live-v....zip dosyasını ANA DİZİNE yükleyin.
# Bu iş akışı zip'i açar, projeyi içindekiyle birebir eşitler (eski/fazla dosyalar silinir), zip'i siler ve APK derlemesini başlatır.
# TR-Live-paket-*.zip dosyaları (hazır hediye / çerçeve) ayrıca yüklenir; içindekiler eklenir ve sonraki güncellemelerde korunur.
# Not: .github/workflows klasörü GitHub kuralı gereği buradan güncellenemez; bir iş akışı dosyası değiştiyse onu elle yükleyin.
on:
  push:
    branches: [main]
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: zip-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          # Tetikleyen eski commit değil, dalın en güncel hali (art arda yüklenen zip'lerin hepsi görünsün).
          ref: main

      - name: Zip'i bul, aç ve projeyi eşitle
        shell: bash
        run: |
          set -euo pipefail
          DID=0
          MAIN=0
          # 1) Paket zipleri (TR-Live-paket-*.zip: hazır hediye / çerçeve dosyaları) olduğu gibi eklenir.
          #    Büyük dosyalar ana zip'e konmaz (GitHub sitesi 25 MB'tan büyük dosya yüklemez).
          for P in ./TR-Live-paket-*.zip; do
            [ -e "$P" ] || continue
            echo "Paket: $P"
            unzip -o -q "$P" -d .
            rm -f "$P"
            DID=1
          done
          # 2) Ana zip: proje içindekiyle birebir eşitlenir; daha önce eklenen paket klasörleri korunur.
          # Birden fazla sürüm zip'i varsa en yüksek sürüm kullanılır (diğerleri silinir).
          ZIP="$(ls ./TR-Live-v*.zip 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$ZIP" ]; then
            echo "Zip: $ZIP"
            T="$(mktemp -d)"
            KEEP="$(mktemp -d)"
            unzip -q "$ZIP" -d "$T"
            [ -f "$T/mobile/pubspec.yaml" ] || { echo "HATA: zip beklenen yapıda değil (mobile/pubspec.yaml yok)"; exit 1; }
            [ -f "$T/backend/package.json" ] || { echo "HATA: zip beklenen yapıda değil (backend/package.json yok)"; exit 1; }
            if [ -d backend/src/samples ]; then
              find backend/src/samples -mindepth 1 -maxdepth 1 -type d -name 'pack*' -exec cp -a {} "$KEEP/" \;
            fi
            # .git ve .github dışındaki her şeyi sil, zip içeriğini (.github hariç) kopyala
            find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
            rm -rf "$T/.github"
            cp -a "$T/." .
            mkdir -p backend/src/samples
            for D in "$KEEP"/pack*; do
              [ -e "$D" ] || continue
              cp -an "$D" backend/src/samples/
            done
            rm -f ./TR-Live-v*.zip
            DID=1
            MAIN=1
          fi
          # Yalnız paket yüklendiyse uygulama değişmedi: APK yeniden derlenmez.
          [ "$MAIN" = 1 ] || echo "PKONLY=1" >> "$GITHUB_ENV"
          if [ "$DID" != 1 ]; then echo "Ana dizinde zip yok; yapılacak bir şey yok."; echo "NOZIP=1" >> "$GITHUB_ENV"; exit 0; fi
          grep -m1 '^version:' mobile/pubspec.yaml | tee /tmp/ver.txt

      - name: Değişiklikleri kaydet
        if: env.NOZIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Değişiklik yok."; exit 0; fi
          VER="$(sed 's/version: *//' /tmp/ver.txt)"
          git commit -q -m "TR Live v${VER} (zip ile güncellendi)"
          # Bu sırada yeni bir dosya yüklendiyse dal ilerlemiş olur: en güncel hale taşıyıp tekrar dene.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Gönderilemedi (dal ilerlemiş), tekrar deneniyor ($i)…"
            sleep $((i * 3))
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort || true; echo "::error::Birleştirilemedi"; exit 1; }
          done
          echo "::error::5 denemede gönderilemedi"; exit 1

      - name: APK derlemesini başlat
        if: env.NOZIP != '1' && env.PKONLY != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run apk_build.yml --ref main || echo "APK derlemesi otomatik başlatılamadı; Actions sekmesinden 'Build Android APK' > Run workflow ile başlatın."
