name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Sunucu adresi (örn. https://api.siteniz.com)"
        required: false
        default: "https://api.example.com"
      allow_http:
        description: "http:// adresine izin ver (yalnızca test için)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/apk_build.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INPUT_API_URL: ${{ github.event.inputs.api_url }}
      INPUT_ALLOW_HTTP: ${{ github.event.inputs.allow_http }}
      REPO_API_URL: ${{ vars.API_URL }}
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Flutter projesini bul (pubspec.yaml nerede olursa olsun)
        shell: bash
        run: |
          set -euo pipefail
          APP_PUBSPEC=""
          while IFS= read -r f; do
            if grep -q 'sdk: flutter' "$f"; then APP_PUBSPEC="$f"; break; fi
          done < <(find . -name pubspec.yaml \
            -not -path '*/.dart_tool/*' -not -path '*/build/*' -not -path '*/.symlinks/*' \
            -not -path '*/node_modules/*' -not -path './.git/*' | sort)
          if [ -z "$APP_PUBSPEC" ]; then
            echo "::error::Depoda Flutter projesi (içinde 'sdk: flutter' geçen pubspec.yaml) bulunamadı."
            echo "Deponun ilk 3 seviyesi:"; find . -maxdepth 3 -not -path './.git/*' | sort | head -80
            exit 1
          fi
          APP_DIR="$(cd "$(dirname "$APP_PUBSPEC")" && pwd)"
          APP_NAME="$(grep -m1 -E '^name:' "$APP_PUBSPEC" | sed -E 's/^name:[[:space:]]*//; s/["'"'"']//g' | tr -d '\r ')"
          if ! printf '%s' "$APP_NAME" | grep -qE '^[a-z][a-z0-9_]*$'; then APP_NAME="tr_live"; fi
          echo "APP_DIR=$APP_DIR"   >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "Flutter projesi bulundu: $APP_DIR (paket adı: $APP_NAME)"

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: android klasörü yoksa sıfırdan üret
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          flutter --version
          HAS_GRADLE=false
          if [ -f android/app/build.gradle ] || [ -f android/app/build.gradle.kts ]; then HAS_GRADLE=true; fi
          if [ -f android/app/src/main/AndroidManifest.xml ] && [ "$HAS_GRADLE" = true ]; then
            echo "android klasörü zaten var, üretilmiyor."
          else
            echo "android klasörü eksik veya yarım; flutter create ile üretiliyor..."
            rm -rf android
            flutter create . --platforms=android --project-name "$APP_NAME" --org com.trlive
            # flutter create örnek bir test ekleyebilir; bu projede olmayan MyApp'e bağlıdır, silinir.
            if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm -f test/widget_test.dart; fi
          fi
          test -f android/app/src/main/AndroidManifest.xml
          echo "android/app içeriği:"; ls -la android/app

      - name: Android ayarlarını düzelt (minSdk 24, izinler)
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib, sys

          # 1) minSdk: build.gradle.kts ve build.gradle ikisini de destekler
          gradle = None
          for name in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              if os.path.exists(name):
                  gradle = pathlib.Path(name); break
          if gradle is None:
              sys.exit("HATA: android/app/build.gradle(.kts) bulunamadı")
          src = gradle.read_text()
          new, n = re.subn(r"(minSdk(?:Version)?)(\s*=?\s*)flutter\.minSdkVersion", r"\g<1>\g<2>24", src)
          if n == 0:
              m = re.search(r"minSdk(?:Version)?\s*=?\s*(\d+)", src)
              if m and int(m.group(1)) >= 24:
                  print(f"minSdk zaten {m.group(1)}")
              elif m:
                  new = re.sub(r"(minSdk(?:Version)?)(\s*=?\s*)\d+", r"\g<1>\g<2>24", src, count=1)
                  n = 1
              else:
                  print("UYARI: minSdk satırı bulunamadı; Flutter varsayılanı kullanılacak")
          if n:
              gradle.write_text(new)
              print(f"{gradle}: minSdk 24 yapıldı")

          # 2) Manifest: izinler (+ isteğe bağlı http izni)
          mf = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = mf.read_text()
          perms = ["INTERNET", "RECORD_AUDIO", "CAMERA", "MODIFY_AUDIO_SETTINGS", "ACCESS_NETWORK_STATE", "BLUETOOTH_CONNECT"]
          add = "".join(f'    <uses-permission android:name="android.permission.{p}"/>\n' for p in perms if f'android.permission.{p}"' not in s)
          if add:
              s = s.replace("<application", add + "    <application", 1)
          if os.environ.get("INPUT_ALLOW_HTTP", "").lower() == "true" and "usesCleartextTraffic" not in s:
              s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
              print("http (cleartext) izni eklendi — yalnızca test için")
          mf.write_text(s)
          print("Manifest izinleri tamam")
          PY

      - name: Sunucu adresini doğrula
        shell: bash
        run: |
          set -euo pipefail
          API_URL="${INPUT_API_URL:-}"
          [ -n "$API_URL" ] || API_URL="${REPO_API_URL:-}"
          [ -n "$API_URL" ] || API_URL="https://api.example.com"
          if ! printf '%s' "$API_URL" | grep -qE '^https?://[A-Za-z0-9._:-]+(/[A-Za-z0-9._/-]*)?$'; then
            echo "::error::Sunucu adresi geçersiz: $API_URL"; exit 1
          fi
          if printf '%s' "$API_URL" | grep -q '^http://' && [ "${INPUT_ALLOW_HTTP:-false}" != "true" ]; then
            echo "::error::Android http:// adreslerini varsayılan olarak engeller. https kullanın ya da 'allow_http' kutusunu işaretleyin (yalnızca test)."
            exit 1
          fi
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "Sunucu adresi: $API_URL"

      - name: Bağımlılıkları indir
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Kod analizi (bilgi amaçlı, derlemeyi durdurmaz)
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || true
          echo "Hata sayısı: $(grep -c ' error • ' analyze.log || true)"

      - name: APK derle
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          # arm64: bugünkü telefonların neredeyse tamamı; tek dosya, küçük boyut. Debug anahtarıyla imzalanır (test/yan yükleme için).
          flutter build apk --release --no-shrink --target-platform android-arm64 \
            --dart-define=API_URL="$API_URL" 2>&1 | tee build.log
          ls -la build/app/outputs/flutter-apk/

      - name: Özet
        if: success()
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          APK="$(ls build/app/outputs/flutter-apk/*.apk | head -1)"
          {
            echo "### APK hazır ✅"
            echo "- Dosya: \`$(basename "$APK")\` ($(du -h "$APK" | cut -f1))"
            echo "- Sunucu adresi: \`$API_URL\`"
            echo "- Aşağıdaki **Artifacts** bölümünden \`tr-live-apk\` dosyasını indirin, zip'ten çıkarıp yükleyin."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK'yı çıktı olarak paylaş
        uses: actions/upload-artifact@v4
        with:
          name: tr-live-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Hata günlüklerini paylaş
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.APP_DIR }}/build.log
            ${{ env.APP_DIR }}/analyze.log
          if-no-files-found: ignore
          retention-days: 7
