# nginx: TLS sonlandırma, hız sınırı, WebSocket, tarayıcı/botlara karşı ilk savunma hattı.
# "api.example.com" adını kendi alan adınızla değiştirin. Sertifika: certbot certonly --standalone -d api.example.com
worker_processes auto;
events { worker_connections 4096; }

http {
  server_tokens off;
  client_max_body_size 4m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  send_timeout 30s;

  # IP başına hız sınırları (uygulama içi güvenlik duvarının ÖNÜNDE çalışır)
  limit_req_zone $binary_remote_addr zone=api:20m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    server_name api.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    limit_conn perip 40;

    # Tarayıcı/zafiyet tarayıcılarının sık denediği yollar: bağlantıyı sessizce kes (444)
    location ~* (\.env|\.git|\.svn|wp-admin|wp-login|xmlrpc\.php|phpmyadmin|\.aws|\.ssh|/etc/passwd) { return 444; }

    # Gerçek istemci IP'si: tek ters vekil olduğundan $remote_addr ATANIR (istemcinin gönderdiği başlık güvenilmez).
    # Cloudflare arkasındaysanız ngx_http_realip_module ile CF-Connecting-IP kullanın.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location /api/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://backend:3000;
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://backend:3000;
    }

    location /ws {
      proxy_pass http://backend:3000;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
    }

    location /uploads/ { proxy_pass http://backend:3000; expires 7d; }
    location /health   { proxy_pass http://backend:3000; access_log off; }
    location /         { return 404; }
  }
}
